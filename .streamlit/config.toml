    "#0891B2",
    "#2563EB",
    "#7C3AED",
    "#059669",
    "#CA8A04",
    "#DC2626",
    "#EA580C",
    "#64748B",
]

chartSequentialColors = [
    "#EFF6FF",
    "#DBEAFE",
    "#BFDBFE",
    "#93C5FD",
    "#60A5FA",
    "#3B82F6",
    "#2563EB",
    "#1D4ED8",
    "#1E40AF",
    "#1E3A8A",
]

dataframeBorderColor = "#D5E1E7"
