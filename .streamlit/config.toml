[theme]
base = "light"
primaryColor = "#0E7490"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F7F9"
textColor = "#0F172A"
linkColor = "#0369A1"
borderColor = "#D5E1E7"
codeBackgroundColor = "#F1F5F9"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "full"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 15
headingFontSizes = ["36px", "27px", "22px", "18px", "15px", "13px"]
headingFontWeights = [700, 650, 650, 600, 600, 600]
linkUnderline = false

blueColor = "#0369A1"
